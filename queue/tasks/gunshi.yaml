  description: |
    【cmd_140 Part 1(設計のみ・実装禁止): stall検知・自動復旧の機構設計】

    🔴本タスクは**設計のみ**。コード実装・commitは一切行うな（実装は貴殿の設計を
    元に足軽へ別途割り当てる、Part 2）。凍結下のカーブアウト(stall検知・自動復旧)
    であり、要件を超える機能を設計に含めるな。

    ■ 目的
    足軽・家老・軍師の stall（セッション生存だがタスク停滞）を機械検知し、
    人間の介入なしに復旧させる機構を設計する。「タスクassign済み **かつ**
    該当paneの出力がN分間静止」をstallと定義（N初期値=10分、設定変更可）。
    復旧は三段: (1)nudge send-keys→(2)N分後家老inbox注入→(3)それでも解消せねば
    ntfy発火。同一paneへのnudgeは1セッション3回まで、上限到達で即ntfy。

    ■ 🔴最重要論点1: 既存3機構との衝突回避
    検知領域が重なる既存機構:
    (a) `scripts/deadman_watcher.sh`（timing_events基準・閾値20分・検出通知のみ・
        自動復旧なし）
    (b) `inbox_watcher.sh` のエスカレーション表（2〜4分でnudge、4分超で/clear送出）
    (c) stale busy recovery（busy継続時のidleフラグ強制）
    これら3機構のコードを実際にRead-before-Editで読み、以下を判断せよ:
    - 既存機構(a)(b)(c)のいずれかを**拡張する**か、**新規プロセス/ロジックを
      追加する**か。両方の選択肢の得失を比較して選び、**選んだ理由と、
      二重発火・ntfy氾濫を防ぐ具体的な仕組みを報告に明記**すること。
    - 特に(b)のnudgeエスカレーション（2〜4分）と本機構のnudge（10分閾値）が
      同一paneに対して二重に発火しないよう、判定条件・優先順位を明確にせよ。

    ■ 🔴最重要論点2: 「1セッション」の境界定義
    同一paneへのnudge上限3回の「1セッション」とは何か——watcherプロセスの
    生存期間か、対象エージェントのセッション（/clear等でリセットされる単位）か。
    **設計時に厳密に定義し、コードとログの双方で一貫させる方法を示せ**。
    曖昧なまま実装すればカウンタが「永久にリセットされない」または
    「毎回リセットされる」のいずれかの事故になる（殿の明示警告）。

    ■ 🔴最重要論点3: 起動直後の一斉誤発火防止
    2026-07-17、deadman_watcher.shが古いtiming記録を掘り起こして8件を
    一斉誤発火した前例がある（elapsed 478〜20,151分）。本機構が
    **watcher起動直後に過去の停滞状態を検知して一斉発火しない**ための
    具体的な設計（例: 起動時刻以降のイベントのみを対象とする等）を示せ。

    ■ ログ設計
    stall検知・nudge送信・復旧結果を時刻つきで専用ログへ記録するスキーマを
    設計せよ。これが**今後の唯一の新規計測**であり、他の計装は追加しない
    （殿の明示指示）。

    ■ 対象外の明記
    「出力は動いているが内容が異常」なケースは対象外——発生時は
    `tmux capture-pane` でログ保存のみとし、判定・復旧の対象に含めない設計とせよ。

    ■ 成果物（報告書に明記すること）
    1. 統合方針（既存拡張 or 新規）とその理由・衝突回避の根拠
    2. 「1セッション」境界の厳密な定義（コード実装方法・ログ記録方法双方）
    3. 起動直後誤発火防止の具体設計
    4. ログスキーマ（フィールド定義）
    5. 実装者（足軽）がそのまま実装できる粒度の詳細仕様（対象ファイル・
       関数名・呼び出し箇所・擬似コード）
    6. bats単体テスト計画（起動直後誤発火防止・nudgeカウンタ上限・ログ形式等、
       単体で検証可能な項目を列挙。E2E(実際のstall発生→nudge→家老inbox→ntfy、
       及び path=pane verdict=idle の人為発生)はKaro自身が実施するため対象外)
    7. D001-D008（特にD006: kill/pkill/tmux kill-session禁止）を遵守した
       実装・反映手段（既存watcherへ反映する具体的な手順）

    ■ スコープ厳守
    - 実装・commitは一切行わない（設計のみ）。
    - 要件を超える機能（新規の常設計装等）を設計に含めない。
    - push禁止。

    ■ 完了報告
    queue/reports/gunshi_report.yaml に task_id: gunshi_design_140 で記録し、
    以下で家老へ通知せよ:

