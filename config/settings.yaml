features:
  fastlane_enabled: true  # cmd_086 Part C: 些事fast-lane暫定運用。誤判定1件で家老がfalseへ
  deadman_enabled: true   # cmd_092: 停滞警報v1。falseで完全無効化
  scope_check_advisory: true  # cmd_097: advisory記録のみ。強制化は別途enforce等で拡張
  yaml_guard_enabled: enforce  # cmd_135(2026-07-29 16:30): 殿明示承認(「enforceはすすめてかまわぬ」)を得てobserve→enforceへ移行。
    # cmd_132の家老集計でFable裁定Q6の4条件(評価141件・出陣2回・偽would-deny0件・fail-open0件)を
    # 全て充足と確認済み。cmd_134工程1(破損YAML修復)・工程2(反復deny警報、commit 615b62a)完了後に実施。
    # ─ 沿革 ─
    # cmd_120: S-1〜Part1-B完了・欠陥1-3修正完了により3値化(off|observe|enforce)。
    # cmd_116緊急是正(2026-07-27 21:10)でfalse(=off)に戻されていたが、cmd_117欠陥1(safe_load_all化)・
    # 欠陥2(ntfy漏出抑止, commit 7c60a7d)・欠陥3(ANSI修復)がすべてQC PASS済みのためobserveへ投入。
    # enforceへの移行はcmd_121 A-1改定の4条件(暦日条件は廃止): (1)対象評価20件以上
    # (2)稼働セッション2回以上に跨る (3)偽would-denyゼロ (4)fail-open発生ゼロまたは全件原因説明済み
    # ——を全て満たしたときのみ候補となり、判定・移行自体は将軍が別途行う。
    # 巻き戻し: 自己修正失敗が出た場合、殿または将軍の判断でobserveへ戻してよい(事後報告可)。
  reporting_mode: exception  # cmd_136(2026-07-29制定・次回出陣から適用): 報告の例外ベース化。
    # exception(既定)=正常完了はdashboard記録のみ、ntfyは失敗・ブロック・caveat付き完了・
    # 殿裁定要・警報類のみ。verbose=旧運用(逐次ntfy)へ即時切り戻し。
    # 対象は将軍配下で完結する自律実行cmdのみ(go-harvester等レビュー依頼/Fable裁定案件/
    # 緊急実害進行中の事象は本flagに関わらず常時ntfy。詳細: instructions/shogun.md
    # 「省力化3点セット」節・instructions/karo.md「省力化3点セット運用」節)。
    # 既定exceptionはcmd_136本文の明示指示であり、cmd_116 S-3の「新規flagは安全側default」
    # 原則の対象外(exception自体が既に殿裁可済みの規律のため)。
deadman:                  # cmd_092: 停滞警報(デッドマンスイッチ)v1のパラメータ
  stall_threshold_min: 20
auto_heal:
  silent_heal_enabled: true
  escalation_window_minutes: 10
  escalation_threshold_count: 3
  cooldown_after_escalation_minutes: 30
redo_escalation:
  threshold_count: 2
  cooldown_after_escalation_minutes: 30
stuck_escalation:
  threshold_count: 2
  window_minutes: 60
  cooldown_after_escalation_minutes: 30
dashboard_staleness:
  hours: 24
  check_interval_minutes: 30
  cooldown_after_escalation_minutes: 360
assignment_grace:
  after_nudge_seconds: 30
cli:
  agents:
    karo:
      type: claude
      model: claude-sonnet-5  # 2026-07-03: switch_cli.sh による切替
      effort: high  # cmd_109: Opus5 effort暗黙継承事故予防のため明示
    ashigaru1:
      type: claude
      model: claude-sonnet-5  # 2026-07-03: switch_cli.sh による切替
      effort: high  # cmd_109: Opus5 effort暗黙継承事故予防のため明示
    ashigaru2:
      type: claude
      model: claude-sonnet-5  # 2026-07-03: switch_cli.sh による切替
      effort: high  # cmd_109: Opus5 effort暗黙継承事故予防のため明示
    ashigaru3:
      type: claude
      # 2026-07-08 殿裁可(cmd_070): opencode v1.17.15のUD2 panic(cmd_069実機確認)・OpenRouter:free不安定を同時に断つためopencodeから恒久切替
      model: claude-sonnet-5  # 2026-07-29 cmd_133: Sonnet帯4席化(殿裁可・Fable経由)、次回出陣時反映
      effort: high  # cmd_109: Opus5 effort暗黙継承事故予防のため明示
    ashigaru4:
      type: claude
      # 2026-07-08 殿嗜好(cmd_071): 布陣の能力順整理(1,2=Sonnet/3-6=Haiku/7=Ollama)のため足軽7とOllama枠を入替
      model: claude-sonnet-5  # 2026-07-29 cmd_133: Sonnet帯4席化(殿裁可・Fable経由)、次回出陣時反映
      effort: high  # cmd_109: Opus5 effort暗黙継承事故予防のため明示
    ashigaru5:
      model: claude-haiku-4-5-20251001
      type: claude
    ashigaru6:
      type: claude
      model: claude-haiku-4-5-20251001  # 2026-06-15: switch_cli.sh による切替
    ashigaru7:
      type: claude
      model: claude-haiku-4-5-20251001  # 2026-07-08 殿裁可(cmd_075): opencode v1.17.15がOllama応答を捌けずタイムアウト(本日2度目のopencode破綻、cmd_069に続く)のため全Claude化。Ollama/opencode一式は休眠温存・削除禁止。opencode修正版が出たら本行をtype:opencode/model:ollama/qwen3.5:9bへ戻すだけで再開可
    gunshi:
      type: claude
      model: claude-sonnet-5  # 2026-07-03: switch_cli.sh による切替
      effort: high  # cmd_109: Opus5 effort暗黙継承事故予防のため明示
    shogun:
      model: claude-opus-5
      type: claude
      effort: high  # cmd_109: Opus5 effort暗黙継承事故予防のため明示
  default: claude
language: ja
ntfy_topic: shogun_notify_w2j7x9k3
logging:
  level: info
  path: /mnt/d/projects/multi-agent-shogun/logs/
shell: bash
skill:
  local_path: /mnt/d/projects/multi-agent-shogun/skills/
  save_path: ~/.claude/skills/
